name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: data360
          POSTGRES_PASSWORD: data360
          POSTGRES_DB: data360_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U data360" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Migrations apply cleanly
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://data360:data360@localhost:5432/data360_test
        run: alembic upgrade head && alembic downgrade base
      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    # Builds the real images, starts the stack and runs the browser journey against it.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          echo "REFERENCE_DATE=2026-10-09" >> .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Health
        run: curl -fsS http://localhost:8080/api/health
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser journey
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Seed command works
        run: docker compose exec -T api python -m app.seed /seed/sample-files
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  publish:
    # Multi-architecture images (Intel/AMD and Apple Silicon/ARM) on GitHub Container Registry.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app == 'api' && 'backend' || 'frontend' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/data-360-v2-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/data-360-v2-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
